<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HopVault</title><style>body{font:16px system-ui;max-width:1000px;margin:auto;padding:16px;color:#222;background:#fafafa}button,input,select{font:inherit;padding:9px;margin:4px;max-width:95%}button{cursor:pointer}article,section{background:white;border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px}small{color:#555}h2{font-size:19px}nav{display:flex;flex-wrap:wrap}label{display:block} .row{display:flex;flex-wrap:wrap;align-items:center;gap:5px}textarea{width:95%;min-height:80px} [hidden]{display:none!important}</style><body><h1>HopVault</h1><p>Organisation statt Konsumoptimierung.</p><section id="login"><input id="url" placeholder="Supabase Project URL"><input id="key" placeholder="Publishable / anon key"><input id="email" type="email" placeholder="E-Mail"><input id="pw" type="password" placeholder="Passwort"><button id="connect">Anmelden</button></section><p id="status" role="status"></p><main id="main" hidden><nav id="nav"></nav><section><button id="add">+ Bier</button><label>Excel importieren (nur leerer Bestand)<input id="file" type="file" accept=".xlsx"></label><button id="export">Excel exportieren</button><button id="backup">JSON-Backup</button><button id="logout">Abmelden</button></section><input id="search" placeholder="Bier, Brauerei, Stil, Hopfen suchen"><div id="summary"></div><div id="list"></div><section id="editor" hidden><h2>Bier bearbeiten</h2><form id="form"></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><script src="app.js"></script></body></html>
