<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HopVault v0.9.1</title><style>*{box-sizing:border-box} :root{color-scheme:dark;--bg:#211b17;--panel:#342a23;--line:#59483b;--accent:#e9a34b;--text:#f8eddd;--muted:#c9b6a3}body{font:15px/1.45 system-ui,sans-serif;max-width:1050px;margin:auto;padding:18px;color:var(--text);background:var(--bg)}h1{font-size:32px;letter-spacing:-1px;color:var(--accent);margin:4px 0 12px}h2{font-size:18px;margin:0 0 6px}button,input,select,textarea{font:inherit;color:var(--text);background:#29211c;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:3px;max-width:100%}button{cursor:pointer;font-weight:600}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#add,#connect,button[type=submit]{background:var(--accent);color:#211b17;border-color:var(--accent)}article,section{background:var(--panel);border:1px solid var(--line);padding:14px;margin:10px 0;border-radius:12px}small{color:var(--muted)}nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}nav button[aria-pressed=true]{background:var(--accent);color:#211b17;border-color:var(--accent)}label{display:block} .row{display:flex;flex-wrap:wrap;align-items:center;gap:5px}textarea{width:95%;min-height:80px} [hidden]{display:none!important}#search{width:100%;margin:8px 0}#summary{color:var(--muted);margin:8px 0 12px}#list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}#list:empty{display:none}#list article{border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}#list article:last-child{border-bottom:0}.beer-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.beer-head h2{margin:0;font-size:17px}.sl-tag{font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:5px;padding:1px 6px}.sl-SL1{color:#f0b75e}.sl-SL2{color:#a6c8eb}.sl-SL3{color:#a8d4ae}.beer-meta,.beer-hops{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.beer-qty{font-size:20px;font-weight:700;color:var(--accent);text-align:right}.beer-actions{grid-column:2;grid-row:2 / span 3;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap}.beer-actions button{font-size:12px;padding:7px 9px}.beer-details{grid-column:1/-1;color:var(--muted);font-size:12px}.beer-details summary{cursor:pointer;width:max-content;color:var(--accent)}#form label{margin:8px 0}#form input,#form select{display:block;width:100%;margin:4px 0}#login input{display:block;width:100%;margin:8px 0}#status{color:var(--muted)}@media(max-width:580px){body{padding:12px}#list article{padding:12px}.beer-actions{grid-column:1/-1;grid-row:auto;justify-content:flex-start}.beer-actions button{margin-left:0}nav button{padding:8px} }#nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:7px 0}#nav button{flex:1 0 auto}#filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 10px}#filters label{font-size:12px;color:var(--muted)}#filters select{display:block;width:100%;margin:3px 0}#filters button{justify-self:start;margin:0}.beer-toggle{cursor:pointer;min-width:0;display:block;width:100%;text-align:left;background:none;border:0;padding:0;margin:0;font-weight:400}.beer-toggle:hover{color:var(--accent)}.beer-detail-wrap{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px}.beer-detail-wrap button{font-size:13px}.beer-date{color:var(--muted);font-size:12px}.beer-right{text-align:right}.beer-right .sl-tag{display:inline-block;margin-top:4px}.beer-hops{margin-top:3px}.beer-meta{margin-top:2px} @media(max-width:580px){#filters{grid-template-columns:repeat(2,minmax(0,1fr))}#filters label:last-of-type{grid-column:1/-1}}
:root{--accent:#B89A5E} [data-cat="SL1"]{--cat:#B89A5E}[data-cat="SL2"]{--cat:#A68B72}[data-cat="SL3"]{--cat:#8C8063}[data-cat="Sonstige"]{--cat:#706359}[data-cat="Archiv"]{--cat:#686C70}[data-cat="Bestellt"]{--cat:#657D79} #nav button[data-cat]{border-bottom:3px solid var(--cat,var(--line))} #nav button[aria-pressed=true]{background:var(--cat,var(--accent));color:#16110e} #list article{border-left:4px solid var(--cat,var(--line));background:color-mix(in srgb,var(--cat,var(--panel)) 12%,var(--panel));padding:9px 12px} .sl-SL1{color:#B89A5E}.sl-SL2{color:#C1A58D}.sl-SL3{color:#B5A98D}.beer-qty{font-size:18px}.beer-meta,.beer-hops,.beer-date{font-size:12px}.beer-toggle .beer-head strong{font-size:16px!important} #tools{padding:6px;margin:5px 0} #tools details{display:inline-block;margin:5px} #tools summary{cursor:pointer;color:var(--muted)} #nav{gap:3px;margin:0} #nav button{padding:7px 10px;margin:0} #filters{gap:5px} #status{font-size:12px;margin:4px 0} #summary{font-size:12px} .beer-detail-wrap select{font-size:13px} @media(max-width:580px){#nav button{font-size:13px;padding:7px 8px} #list article{padding:8px 10px}}

/* Amber Earth: category colours stay visible even when not selected. */
#nav button{background:var(--cat,#342A23);color:#fff8ee;border:2px solid transparent;border-bottom:2px solid transparent;outline:none;min-height:42px;}
#nav button[data-cat="Bestand"]{--cat:#59483B}
#nav button[data-cat="Frische"]{--cat:#695746}
#nav button[data-cat="SL1"],#nav button[data-cat="SL2"],#nav button[data-cat="SL3"]{color:#17120e}
#nav button[data-cat="1"],#nav button[data-cat="2"],#nav button[data-cat="3"]{--cat:#45382e}
#nav button[aria-pressed=true]{background:var(--cat,#342A23);color:#fff8ee;border-color:#f8eddd;box-shadow:inset 0 0 0 1px #211b17}
#nav button[data-cat="SL1"][aria-pressed=true],#nav button[data-cat="SL2"][aria-pressed=true],#nav button[data-cat="SL3"][aria-pressed=true]{color:#17120e}
#nav button:focus-visible{outline:2px solid #f8eddd;outline-offset:2px}
#list article[data-cat]{border-left-color:var(--cat);background:color-mix(in srgb,var(--cat) 19%,var(--panel))}
#list article[data-cat] .beer-qty{color:#F8EDDD}
.version{font-size:11px;font-weight:400;letter-spacing:0;color:var(--muted)}
</style><body><h1>HopVault <small class="version">v0.9.1</small></h1><section id="login"><input id="url" placeholder="Supabase Project URL"><input id="key" placeholder="Publishable / anon key"><input id="email" type="email" placeholder="E-Mail"><input id="pw" type="password" placeholder="Passwort"><button id="connect">Anmelden</button></section><p id="status" role="status"></p><main id="main" hidden><nav id="nav"></nav><section id="tools"><button id="add">+ Bier</button><details><summary>Excel & Backup</summary><label>Excel importieren (nur leerer Bestand)<input id="file" type="file" accept=".xlsx"></label><button id="export">Excel exportieren</button><button id="backup">JSON-Backup</button><button id="logout">Abmelden</button></details></section><input id="search" placeholder="Bier, Brauerei, Stil, Hopfen suchen"><div id="filters"><label>Hopfen<select id="filterHop"><option value="">Alle</option></select></label><label>Lagerort<select id="filterPlace"><option value="">Alle</option><option>Kühlschrank</option><option>Kühlschrank Garage</option><option>Weinkühlschrank</option><option>Bestellt</option><option>Ungeklärt</option></select></label><label>Sortieren nach<select id="sortBy"><option value="date">Trinkdatum</option><option value="hop">Hopfen A–Z</option><option value="place">Lagerort</option><option value="brewery">Brauerei A–Z</option><option value="name">Biername A–Z</option></select></label><button id="resetFilters" type="button">Filter zurücksetzen</button></div><div id="summary"></div><div id="list"></div><section id="editor" hidden><h2>Bier bearbeiten</h2><form id="form"></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><script src="app.js?v=091-amber-earth-counts-1"></script></body></html>
